          y: 184
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: lm

        # =====================
        # CURRENT — RIGHT PANEL (x 304–639, y 60–244)
        # 2-column × 3-row weather details
        # Left col (x 304–471): Sunrise, Humidity, Precip
        # Right col (x 472–639): Sunset, Wind, Pressure
        # Row tops: 66, 120, 174 | icon 28×28 | legend size:13, value size:19
        # =====================

        # ── LEFT COL ROW 1: Sunrise ──
        - type: icon
          value: mdi:weather-sunset-up
          x: 312
          y: 72
          size: 32
          color: black
