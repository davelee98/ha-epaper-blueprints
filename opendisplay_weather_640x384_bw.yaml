blueprint:
  name: "OpenDisplay Weather for 640x384 BW"
  description: >
    Current weather + 5-day forecast for a 640x384 e-paper display, such as the
    Chroma 7.4in. Draws in black only, so it also suits a BWY panel without
    using the accent colour.

    Needs the OpenDisplay HACS custom integration, 3.0.0-beta9 or newer, and
    Jost-SemiBold.ttf plus Jost-Medium.ttf in /config/www/fonts/. Non-Latin
    languages need a different font.

    Everything else — fonts, languages, scheduling, known limits — is under
    Reference at the bottom of this form.
  domain: automation
  input:
    weather_entity:
      name: Weather Entity
      description: >
        Weather entity supplying current conditions and the daily forecast.
        Must support the daily forecast type.
      default: weather.forecast_home
      selector:
        entity:
          filter:
            - domain: weather
    location_string:
      name: Location Name
      description: "Label displayed at the top of the screen (e.g. 'Chicago, Illinois')"
      selector:
        text:
    language:
      name: Language
      description: >
        Language for the panel labels and weekday abbreviations. Weather data
        itself is rendered as numbers and icons, so it is language independent.
      default: en
      selector:
        select:
          options:
            - {value: en, label: English}
            - {value: de, label: Deutsch}
            - {value: nl, label: Nederlands}
            - {value: fr, label: Français}
            - {value: es, label: Español}
            - {value: it, label: Italiano}
            - {value: pt, label: Português}
            - {value: sv, label: Svenska}
            - {value: da, label: Dansk}
            - {value: nb, label: Norsk bokmål}
            - {value: pl, label: Polski}
            - {value: zh-Hans, label: 简体中文 (needs a CJK font)}
            - {value: ja, label: 日本語 (needs a CJK font)}
            - {value: ko, label: 한국어 (needs a CJK font)}
    time_format:
      name: Clock Format
      description: >
        Auto uses a 12-hour clock in America/* time zones and a 24-hour clock
        everywhere else. Clock convention follows where the display is, not
        which language it is set to, so this is separate from the Language
        input. Applies to the header time and the sunrise/sunset rows.
      default: auto
      selector:
        select:
          options:
            - {value: auto, label: "Auto (from time zone)"}
            - {value: "12", label: "12-hour (3:45 PM)"}
            - {value: "24", label: "24-hour (15:45)"}
    decimal_separator:
      name: Decimal Separator
      description: >
        Separator for the pressure reading, the only value with decimals.
        Auto follows the selected language.
      default: auto
      selector:
        select:
          options:
            - {value: auto, label: "Auto (from language)"}
            - {value: period, label: "Period (1.013)"}
            - {value: comma, label: "Comma (1,013)"}
    font_family:
      name: Font
      description: >
        Font used for all text. A family name expands to the -SemiBold and
        -Medium pair in /config/www/fonts/, which is how Jost and the Noto
        Sans builds are named. The list is not exhaustive: type any other
        family name, or a filename such as ppb.ttf to use one of the fonts
        bundled with the integration, or an absolute path. A value that
        includes a path separator or a .ttf/.otf/.ttc extension is used as
        given for both weights, so the text will be a single weight.
      default: Jost
      selector:
        select:
          custom_value: true
          options:
            - {value: Jost, label: "Jost — Latin, Latin Extended, Cyrillic"}
            - {value: NotoSansSC, label: "Noto Sans SC — 简体中文"}
            - {value: NotoSansJP, label: "Noto Sans JP — 日本語"}
            - {value: NotoSansKR, label: "Noto Sans KR — 한국어"}
    device_id:
      name: Display Device
      description: "device_id of the OpenDisplay e-paper target for opendisplay.drawcustom"
      selector:
        device:
    update_hours:
      name: Update Interval — Hours
      description: >
        Pair this with Minutes below. For hourly or slower, choose an hours
        value here and leave Minutes on "On the hour". For sub-hourly, set this
        to "Any hour" and choose a Minutes value. Mixing the two, for example
        every 2 hours with every 30 minutes, gives two updates inside each even
        hour and none in odd hours.
      default: "/1"
      selector:
        select:
          options:
            - {value: "*", label: "Any hour (for sub-hourly updates)"}
            - {value: "/1", label: "Every hour"}
            - {value: "/2", label: "Every 2 hours"}
            - {value: "/3", label: "Every 3 hours"}
            - {value: "/4", label: "Every 4 hours"}
            - {value: "/6", label: "Every 6 hours"}
            - {value: "/8", label: "Every 8 hours"}
            - {value: "/12", label: "Every 12 hours"}
    update_minutes:
      name: Update Interval — Minutes
      description: >
        Leave on "On the hour" unless Hours is set to "Any hour". Sub-hourly
        updates are hard on an e-paper panel: every refresh cycles it, and on a
        battery tag it shows in the battery life.
      default: "0"
      selector:
        select:
          options:
            - {value: "0", label: "On the hour"}
            - {value: "/30", label: "Every 30 minutes"}
            - {value: "/20", label: "Every 20 minutes"}
            - {value: "/15", label: "Every 15 minutes"}
            - {value: "/10", label: "Every 10 minutes"}
            - {value: "/5", label: "Every 5 minutes"}
    label_overrides:
      name: Custom Labels
      icon: mdi:translate
      description: >
        Optional. Leave a field blank to use the wording for the selected
        language. Use these to correct a translation, shorten a label that
        does not fit, or support a language that is not in the list.
      collapsed: true
      input:
        label_sunrise:
          name: Sunrise
          default: ""
          selector:
            text:
        label_sunset:
          name: Sunset
          default: ""
          selector:
            text:
        label_humidity:
          name: Humidity
          default: ""
          selector:
            text:
        label_precipitation:
          name: Precipitation
          default: ""
          selector:
            text:
        label_wind:
          name: Wind
          default: ""
          selector:
            text:
        label_pressure:
          name: Pressure
          default: ""
          selector:
            text:
        label_days:
          name: Weekday Abbreviations
          description: >
            Seven comma-separated abbreviations, Monday first, e.g.
            MON,TUE,WED,THU,FRI,SAT,SUN. Ignored unless exactly seven are given.
          default: ""
          selector:
            text:
        label_datefmt:
          name: Header Date Line
          description: >
            Pattern for the line under the location name. Tokens:
            {weekday} full weekday, {wday} abbreviated weekday, {month} full
            month, {mon} month number, {mon2} zero-padded month, {day} day,
            {day2} zero-padded day, {year} year, {ord} English ordinal suffix,
            {time} time in the selected clock format. Any other text is kept as
            written. Full weekday and month names exist for English only; other
            languages fall back to the abbreviation and the month number.
          default: ""
          selector:
            text:

    reference:
      name: Reference
      icon: mdi:information-outline
      collapsed: true
      description: >
        DATA SOURCES

        Sunrise/sunset and the day/night icon variants come from sun.sun, which
        always follows the home location set in Home Assistant. If the selected
        weather entity is for a different location, those sun times will still
        be for home. Home Assistant allows only one sun entity, so this is not
        configurable.

        INTEGRATION

        Requires the OpenDisplay HACS custom integration, minimum version
        3.0.0-beta9. The core OpenDisplay integration does not provide the
        drawcustom action, only upload_image.

        LANGUAGE

        Panel labels, weekday abbreviations and the header date line follow the
        Language input, with per-item overrides under Custom Labels. Clock
        format and decimal separator are separate inputs, since neither follows
        from the label language.

        The header date line is built from a token pattern rather than
        strftime, because Python renders weekday and month names in the C
        locale and Home Assistant never calls setlocale, so %A and %B are
        always English. Full weekday and month names are supplied for English
        only; the other languages use their abbreviation and a numeric month,
        which keeps the wording correct without shipping 12 unreviewed month
        names per language. Any language can be given a full pattern through
        the Header Date Line override.

        SCHEDULE

        The two Update Interval inputs map onto a single time_pattern trigger.
        Hours alone gives hourly or slower; setting Hours to "Any hour" and
        choosing a Minutes value gives sub-hourly. Seconds default to zero
        whenever minutes are set, so a trigger never fires more than once a
        minute.

        This governs how often Home Assistant renders and sends an image, not
        how often the tag wakes up. That is the integration's ttl, which this
        blueprint does not set, so a slower interval reduces images sent rather
        than radio traffic.

        LABEL SIZING

        Each detail label is centred between its row icon and the column edge,
        so the icon sets the width budget: 60px of half-width on the 800x480
        and 48px on the 640x384, less a 5px gap so the text does not touch the
        icon. Labels are sized individually, so only one that would not fit
        steps down and the rest keep full size. The two columns can therefore
        differ in size within a row.

        Widths come from measured Jost Medium advance widths rather than a flat
        per-character average, because character counts model this badly:
        Sonnenaufgang runs 0.53em per character while Luftfeuchtigkeit runs
        0.42, so a single average either lets the wide words overrun or shrinks
        the narrow ones needlessly. CJK glyphs are full-em and their wording is
        short, so those languages stay at full size.

        Text typed into Custom Labels has no measured width, so it falls back to
        0.55em per character, slightly wider than any measured label. That is
        deliberately conservative: an override will sometimes render a step or
        two smaller than it strictly needs to, rather than running under the
        icon.

        The measurements are for Jost. Choosing a different font in the Font
        input shifts the real widths, so sizing becomes approximate again,
        though Latin sans faces are close enough that the result stays sane.

        FONTS

        Jost-SemiBold.ttf and Jost-Medium.ttf go in /config/www/fonts/. Create
        that directory if it does not exist; it is searched by default but is
        not created by Home Assistant.

        Jost covers Latin, Latin Extended and Cyrillic only, so the CJK
        languages need an additional font. Download the matching Noto Sans
        family from fonts.google.com, put these two files in
        /config/www/fonts/, then pick the family in the Font input:

          简体中文  ->  NotoSansSC-SemiBold.ttf / NotoSansSC-Medium.ttf
          日本語    ->  NotoSansJP-SemiBold.ttf / NotoSansJP-Medium.ttf
          한국어    ->  NotoSansKR-SemiBold.ttf / NotoSansKR-Medium.ttf

        Take those from the static/ folder of the Google Fonts download, not
        the NotoSansSC[wght].ttf style file in the top level. That one is a
        variable font, and the drawcustom font option takes a plain path with
        no way to select a named instance, so it renders at the axis default
        weight. A .ttc collection fails for the same reason: no face index can
        be given.

        Each Noto Sans build also carries Latin, so one file covers the labels,
        digits and units together. Expect 5-16 MB per weight against 40 KB for
        Jost; this is rendered on the Home Assistant host, so it costs disk
        there and nothing on the display.

        If a font is missing the integration logs a warning and silently falls
        back to its bundled Poppins/Roboto, which have no CJK glyphs, so an
        unconfigured CJK language renders as empty boxes rather than raising an
        error. Check the log after the first run.

        KNOWN LIMITS

        Percent signs render as 65% with no locale spacing, numbers carry no
        thousands separator, and the large temperature shows a bare degree sign
        with no C or F. Right-to-left and complex scripts entered through
        Custom Labels will not render correctly: they need bidi reordering and
        glyph shaping, which PIL only performs when Pillow is built against
        libraqm.
      input: {}

triggers:
  - trigger: time_pattern
    hours: !input update_hours
    minutes: !input update_minutes

actions:
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: !input weather_entity
    response_variable: forecast
  - variables:
      # _weather is declared first: _cicons below renders against it, and
      # variables in a block are evaluated in order.
      _weather: !input weather_entity
      _location: !input location_string
      _lang: !input language
      _o_sunrise: !input label_sunrise
      _o_sunset: !input label_sunset
      _o_humidity: !input label_humidity
      _o_precip: !input label_precipitation
      _o_wind: !input label_wind
      _o_pressure: !input label_pressure
      _o_days: !input label_days
      _o_datefmt: !input label_datefmt
      _tf: !input time_format
      _o_dec: !input decimal_separator
      # Canned label sets, with any Custom Labels input taking precedence.
      # Weekday lists are Monday-first to match datetime.weekday().
      _i18n: >-
        {%- set t = {
          'en': {'sunrise': 'Sunrise', 'sunset': 'Sunset', 'humidity': 'Humidity',
                 'precip': 'Precipitation', 'wind': 'Wind', 'pressure': 'Pressure',
                 'days': ['MON','TUE','WED','THU','FRI','SAT','SUN']},
          'de': {'sunrise': 'Sonnenaufgang', 'sunset': 'Sonnenuntergang', 'humidity': 'Luftfeuchtigkeit',
                 'precip': 'Niederschlag', 'wind': 'Wind', 'pressure': 'Luftdruck',
                 'days': ['MO','DI','MI','DO','FR','SA','SO']},
          'nl': {'sunrise': 'Zonsopgang', 'sunset': 'Zonsondergang', 'humidity': 'Luchtvochtigheid',
                 'precip': 'Neerslag', 'wind': 'Wind', 'pressure': 'Luchtdruk',
                 'days': ['MA','DI','WO','DO','VR','ZA','ZO']},
          'fr': {'sunrise': 'Lever du soleil', 'sunset': 'Coucher du soleil', 'humidity': 'Humidité',
                 'precip': 'Précipitations', 'wind': 'Vent', 'pressure': 'Pression',
                 'days': ['LUN','MAR','MER','JEU','VEN','SAM','DIM']},
          'es': {'sunrise': 'Amanecer', 'sunset': 'Atardecer', 'humidity': 'Humedad',
                 'precip': 'Precipitación', 'wind': 'Viento', 'pressure': 'Presión',
                 'days': ['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM']},
          'it': {'sunrise': 'Alba', 'sunset': 'Tramonto', 'humidity': 'Umidità',
                 'precip': 'Precipitazioni', 'wind': 'Vento', 'pressure': 'Pressione',
                 'days': ['LUN','MAR','MER','GIO','VEN','SAB','DOM']},
          'pt': {'sunrise': 'Nascer do sol', 'sunset': 'Pôr do sol', 'humidity': 'Humidade',
                 'precip': 'Precipitação', 'wind': 'Vento', 'pressure': 'Pressão',
                 'days': ['SEG','TER','QUA','QUI','SEX','SÁB','DOM']},
          'sv': {'sunrise': 'Soluppgång', 'sunset': 'Solnedgång', 'humidity': 'Luftfuktighet',
                 'precip': 'Nederbörd', 'wind': 'Vind', 'pressure': 'Lufttryck',
                 'days': ['MÅN','TIS','ONS','TOR','FRE','LÖR','SÖN']},
          'da': {'sunrise': 'Solopgang', 'sunset': 'Solnedgang', 'humidity': 'Luftfugtighed',
                 'precip': 'Nedbør', 'wind': 'Vind', 'pressure': 'Lufttryk',
                 'days': ['MAN','TIR','ONS','TOR','FRE','LØR','SØN']},
          'nb': {'sunrise': 'Soloppgang', 'sunset': 'Solnedgang', 'humidity': 'Luftfuktighet',
                 'precip': 'Nedbør', 'wind': 'Vind', 'pressure': 'Lufttrykk',
                 'days': ['MAN','TIR','ONS','TOR','FRE','LØR','SØN']},
          'pl': {'sunrise': 'Wschód słońca', 'sunset': 'Zachód słońca', 'humidity': 'Wilgotność',
                 'precip': 'Opady', 'wind': 'Wiatr', 'pressure': 'Ciśnienie',
                 'days': ['PON','WT','ŚR','CZW','PT','SOB','ND']},
          'zh-Hans': {'sunrise': '日出', 'sunset': '日落', 'humidity': '湿度',
                 'precip': '降水概率', 'wind': '风速', 'pressure': '气压',
                 'days': ['周一','周二','周三','周四','周五','周六','周日']},
          'ja': {'sunrise': '日の出', 'sunset': '日の入り', 'humidity': '湿度',
                 'precip': '降水確率', 'wind': '風速', 'pressure': '気圧',
                 'days': ['月','火','水','木','金','土','日']},
          'ko': {'sunrise': '일출', 'sunset': '일몰', 'humidity': '습도',
                 'precip': '강수확률', 'wind': '풍속', 'pressure': '기압',
                 'days': ['월','화','수','목','금','토','일']}
        } -%}
        {%- set f = {
          'en': {'date': '{weekday}, {month} {day}{ord} as of {time}', 'dec': '.', 'w': [327, 290, 395, 552, 242, 379]},
          'de': {'date': '{wday} {day2}.{mon2}. um {time}', 'dec': ',', 'w': [690, 781, 672, 588, 242, 409]},
          'nl': {'date': '{wday} {day2}-{mon2} om {time}', 'dec': ',', 'w': [548, 694, 745, 399, 242, 432]},
          'fr': {'date': '{wday} {day2}/{mon2} à {time}', 'dec': ',', 'w': [642, 776, 402, 594, 204, 371]},
          'es': {'date': '{wday} {day2}/{mon2} a las {time}', 'dec': ',', 'w': [447, 436, 431, 573, 288, 329]},
          'it': {'date': '{wday} {day2}/{mon2} alle {time}', 'dec': ',', 'w': [203, 412, 336, 600, 261, 425]},
          'pt': {'date': '{wday} {day2}/{mon2} às {time}', 'dec': ',', 'w': [609, 450, 457, 543, 261, 341]},
          'sv': {'date': '{wday} {day2}-{mon2} kl. {time}', 'dec': ',', 'w': [534, 529, 543, 493, 209, 370]},
          'da': {'date': '{wday} {day2}-{mon2} kl. {time}', 'dec': ',', 'w': [476, 528, 584, 342, 209, 322]},
          'nb': {'date': '{wday} {day2}-{mon2} kl. {time}', 'dec': ',', 'w': [535, 528, 543, 342, 209, 371]},
          'pl': {'date': '{wday} {day2}.{mon2} o {time}', 'dec': ',', 'w': [669, 633, 497, 296, 243, 408]},
          'zh-Hans': {'date': '{mon}月{day}日 {wday} {time}', 'dec': '.', 'w': [200, 200, 200, 400, 200, 200]},
          'ja': {'date': '{mon}月{day}日({wday}) {time}現在', 'dec': '.', 'w': [300, 400, 200, 400, 200, 200]},
          'ko': {'date': '{mon}월 {day}일 ({wday}) {time} 기준', 'dec': '.', 'w': [200, 200, 200, 400, 200, 200]}
        } -%}
        {%- set base = t.get(_lang, t['en']) -%}
        {%- set fb = f.get(_lang, f['en']) -%}
        {%- set od = _o_days.split(',') | map('trim') | select | list -%}
        {{ {
          'sunrise':  _o_sunrise  or base.sunrise,
          'sunset':   _o_sunset   or base.sunset,
          'humidity': _o_humidity or base.humidity,
          'precip':   _o_precip   or base.precip,
          'wind':     _o_wind     or base.wind,
          'pressure': _o_pressure or base.pressure,
          'days': od if od | length == 7 else base.days,
          'date_fmt': fb.date,
          'dec': fb.dec,
          'wide': 'y' if _lang in ['zh-Hans', 'ja', 'ko'] else 'n',
          'w': [
                 (_o_sunrise | length) * 55 if _o_sunrise else fb.w[0],
                 (_o_sunset | length) * 55 if _o_sunset else fb.w[1],
                 (_o_humidity | length) * 55 if _o_humidity else fb.w[2],
                 (_o_precip | length) * 55 if _o_precip else fb.w[3],
                 (_o_wind | length) * 55 if _o_wind else fb.w[4],
                 (_o_pressure | length) * 55 if _o_pressure else fb.w[5]
          ],
          'wdays': ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']
                   if _lang == 'en' else [],
          'months': ['January','February','March','April','May','June','July',
                     'August','September','October','November','December']
                    if _lang == 'en' else []
        } | tojson }}
      # Clock convention follows the time zone, not the label language.
      _12h: >-
        {{ 'y' if _tf == '12' or (_tf == 'auto'
           and (now().tzinfo | string).startswith('America/')) else 'n' }}
      # Each detail label is centred between its row icon and the column edge,
      # so the icon sets the width budget: 48px of half-width, less a 5px gap,
      # giving an 86px label. Halve the budget to get the half-width.
      # b['w'] holds each label's width in hundredths of an em, measured from
      # Jost Medium, rather than guessed from a flat per-character average:
      # Sonnenaufgang runs 0.53em/char where Luftfeuchtigkeit runs 0.42.
      # CJK glyphs are full-em. Custom Labels fall back to 0.55em per character.
      _lblsizes: >-
        {%- set b = _i18n -%}
        {{ {
          'sunrise':  [[14, (8600 / b['w'][0]) | int] | min, 9] | max,
          'sunset':   [[14, (8600 / b['w'][1]) | int] | min, 9] | max,
          'humidity': [[14, (8600 / b['w'][2]) | int] | min, 9] | max,
          'precip':   [[14, (8600 / b['w'][3]) | int] | min, 9] | max,
          'wind':     [[14, (8600 / b['w'][4]) | int] | min, 9] | max,
          'pressure': [[14, (8600 / b['w'][5]) | int] | min, 9] | max
        } | tojson }}
      _dec: >-
        {%- if _o_dec == 'period' -%}.
        {%- elif _o_dec == 'comma' -%},
        {%- else -%}{{ _i18n['dec'] }}{%- endif -%}
      # Header date line. Tokens are substituted longest-first so that
      # {weekday}/{wday}, {month}/{mon2}/{mon} and {day2}/{day} cannot collide.
      _header: >-
        {%- set n = now() -%}
        {%- set b = _i18n -%}
        {%- set dd = n.day -%}
        {%- set sfx = 'th' if 11 <= dd <= 13
                      else {1: 'st', 2: 'nd', 3: 'rd'}.get(dd % 10, 'th') -%}
        {%- set tm = n.strftime('%-I:%M %p') if _12h == 'y' else n.strftime('%H:%M') -%}
        {%- set fmt = _o_datefmt | trim or b['date_fmt'] -%}
        {{ fmt
           | replace('{weekday}', (b['wdays'] or b['days'])[n.weekday()])
           | replace('{month}', b['months'][n.month - 1] if b['months'] else n.month | string)
           | replace('{wday}', b['days'][n.weekday()])
           | replace('{day2}', '%02d' | format(dd))
           | replace('{mon2}', '%02d' | format(n.month))
           | replace('{year}', n.year | string)
           | replace('{day}', dd | string)
           | replace('{mon}', n.month | string)
           | replace('{ord}', sfx)
           | replace('{time}', tm) }}
      _font: !input font_family
      # A bare family name expands to the -SemiBold/-Medium pair under
      # /config/www/fonts/. Anything carrying a path separator or a font
      # extension is passed through untouched, and then serves both weights.
      _font_main: >-
        {%- set f = _font | trim -%}
        {%- if '/' in f or f.split('.')[-1] | lower in ['ttf', 'otf', 'ttc'] -%}
        {{ f }}
        {%- else -%}
        {{ '/config/www/fonts/' ~ f ~ '-SemiBold.ttf' }}
        {%- endif -%}
      _font_small: >-
        {%- set f = _font | trim -%}
        {%- if '/' in f or f.split('.')[-1] | lower in ['ttf', 'otf', 'ttc'] -%}
        {{ f }}
        {%- else -%}
        {{ '/config/www/fonts/' ~ f ~ '-Medium.ttf' }}
        {%- endif -%}
      _cicons: >-
        {%- macro cond_icon(condition, is_day=true) -%}
          {%- set m = {
            'sunny': 'mdi:weather-sunny',
            'clear-night': 'mdi:weather-night',
            'partlycloudy': 'mdi:weather-partly-cloudy' if is_day else 'mdi:weather-night-partly-cloudy',
            'cloudy': 'mdi:weather-cloudy',
            'fog': 'mdi:weather-fog',
            'rainy': 'mdi:weather-rainy',
            'pouring': 'mdi:weather-pouring',
            'lightning': 'mdi:weather-lightning',
            'lightning-rainy': 'mdi:weather-lightning-rainy',
            'snowy': 'mdi:weather-snowy',
            'snowy-rainy': 'mdi:weather-snowy-rainy',
            'hail': 'mdi:weather-hail',
            'windy': 'mdi:weather-windy',
            'windy-variant': 'mdi:weather-windy-variant',
            'exceptional': 'mdi:weather-cloudy'
          } -%}
          {{ m.get(condition, 'mdi:weather-cloudy') }}
        {%- endmacro -%}
        {%- set sun_el = state_attr('sun.sun','elevation') -%}
        {%- set is_day = sun_el | float(0) > 0 -%}
        {%- set fc = forecast[_weather].forecast -%}
        {{ {
          'current': cond_icon(states(_weather), is_day) | trim,
          'fc1': cond_icon(fc[1].condition) | trim,
          'fc2': cond_icon(fc[2].condition) | trim,
          'fc3': cond_icon(fc[3].condition) | trim,
          'fc4': cond_icon(fc[4].condition) | trim,
          'fc5': cond_icon(fc[5].condition) | trim
        } | tojson }}

  - action: opendisplay.drawcustom
