      background: white
      dither: none
      rotate: 0
      payload:

        # =====================
        # HEADER (y 0–40)
        # =====================
        - type: text
          value: "{{ _location }}"
          x: 320
          y: 10
          size: 26
          color: black
          font: "{{ _font_main }}"
