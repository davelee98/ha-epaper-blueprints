blueprint:
  name: "OpenDisplay Weather for 800x480 BW"
  description: >
    Current weather + 5-day forecast for an 800x480 black & white e-paper display.
    Pulls data from weather.forecast_home and sun.sun.
    Requires Jost-SemiBold.ttf and Jost-Medium.ttf at /config/www/fonts/.
  domain: automation
  input:
    location_string:
      name: Location Name
      description: "Label displayed at the top of the screen (e.g. 'Chicago, Illinois')"
      selector:
        text:
    device_id:
      name: Display Device
      description: "device_id of the OpenDisplay e-paper target for open_epaper_link.drawcustom"
      selector:
        device:

triggers:
  - trigger: time_pattern
    hours: /1

actions:
  - action: weather.get_forecasts
    data:
      type: daily
    target:
      entity_id: weather.forecast_home
    response_variable: forecast
  - variables:
      _location: !input location_string
      _font_main: "/config/www/fonts/Jost-SemiBold.ttf"
      _font_small: "/config/www/fonts/Jost-Medium.ttf"
      _cicons: >-
        {%- macro cond_icon(condition, is_day=true) -%}
          {%- set m = {
            'sunny': 'mdi:weather-sunny',
            'clear-night': 'mdi:weather-night',
            'partlycloudy': 'mdi:weather-partly-cloudy' if is_day else 'mdi:weather-night-partly-cloudy',
            'cloudy': 'mdi:weather-cloudy',
            'fog': 'mdi:weather-fog',
            'rainy': 'mdi:weather-rainy',
            'pouring': 'mdi:weather-pouring',
            'lightning': 'mdi:weather-lightning',
            'lightning-rainy': 'mdi:weather-lightning-rainy',
            'snowy': 'mdi:weather-snowy',
            'snowy-rainy': 'mdi:weather-snowy-rainy',
            'hail': 'mdi:weather-hail',
            'windy': 'mdi:weather-windy',
            'windy-variant': 'mdi:weather-windy-variant',
            'exceptional': 'mdi:weather-cloudy'
          } -%}
          {{ m.get(condition, 'mdi:weather-cloudy') }}
        {%- endmacro -%}
        {%- set sun_el = state_attr('sun.sun','elevation') -%}
        {%- set is_day = sun_el | float(0) > 0 -%}
        {%- set fc = forecast['weather.forecast_home'].forecast -%}
        {{ {
          'current': cond_icon(states('weather.forecast_home'), is_day) | trim,
          'fc1': cond_icon(fc[1].condition) | trim,
          'fc2': cond_icon(fc[2].condition) | trim,
          'fc3': cond_icon(fc[3].condition) | trim,
          'fc4': cond_icon(fc[4].condition) | trim,
          'fc5': cond_icon(fc[5].condition) | trim
        } | tojson }}

  - action: open_epaper_link.drawcustom
    data:
      background: white
      dither: none
      rotate: 0
      payload:

        # =====================
        # HEADER (y 0–50)
        # =====================
        - type: text
          value: "{{ _location }}"
          x: 400
          y: 12
          size: 32
          color: black
          font: "{{ _font_main }}"
          anchor: mt
        - type: text
          value: >-
            {%- set d = now().day -%}
            {%- set sfx = 'th' if 11 <= d <= 13 else ('st' if d % 10 == 1 else ('nd' if d % 10 == 2 else ('rd' if d % 10 == 3 else 'th'))) -%}
            {{ now().strftime('%A, %B ') }}{{ d }}{{ sfx }} as of {{ now().strftime('%-I:%M %p') }}
          x: 400
          y: 44
          size: 20
          color: black
          font: "{{ _font_small }}"
          anchor: mt

        # =====================
        # CURRENT — LEFT PANEL (x 0–359, y 46–304)
        # Weather icon + large temperature
        # =====================
        - type: icon
          value: "{{ _cicons['current'] }}"
          x: 20
          y: 90
          size: 180
          color: black
        - type: text
          value: "{{ state_attr('weather.forecast_home', 'temperature') | round(0) | int }}°"
          x: 220
          y: 130
          size: 80
          color: black
          font: "{{ _font_main }}"
          anchor: lt
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[0].temperature | round(0) | int }} /"
          x: 285
          y: 230
          size: 28
          color: black
          font: "{{ _font_main }}"
          anchor: rm
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[0].templow | round(0) | int }}"
          x: 295
          y: 230
          size: 28
          color: black
          font: "{{ _font_main }}"
          anchor: lm

        # =====================
        # CURRENT — RIGHT PANEL (x 380–799, y 75–305)
        # 2-column × 3-row weather details
        # Left col (x 380–589): Sunrise, Humidity, Precip
        # Right col (x 590–799): Sunset, Wind, Pressure
        # Row tops: 82, 150, 218 | icon 40×40 | legend size:18, value size:25
        # =====================

        # ── LEFT COL ROW 1: Sunrise ──
        - type: icon
          value: mdi:weather-sunset-up
          x: 390
          y: 90
          size: 40
          color: black
        - type: text
          value: "Sunrise"
          x: 490
          y: 98
          size: 18
          color: black
          font: "{{ _font_small }}"
          anchor: mm
        - type: text
          value: "{{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%-I:%M %p') }}"
          x: 490
          y: 125
          size: 25
          color: black
          font: "{{ _font_small }}"
          anchor: mm

        # ── LEFT COL ROW 2: Humidity ──
        - type: icon
          value: mdi:water
          x: 390
          y: 160
          size: 40
          color: black
        - type: text
          value: "Humidity"
          x: 490
          y: 168
          size: 18
          color: black
          font: "{{ _font_small }}"
          anchor: mm
        - type: text
          value: "{{ state_attr('weather.forecast_home', 'humidity') | round(0) | int }}%"
          x: 490
          y: 195
          size: 25
          color: black
          font: "{{ _font_small }}"
          anchor: mm

        # ── LEFT COL ROW 3: Precipitation ──
        - type: icon
          value: mdi:water-percent
          x: 390
          y: 230
          size: 50
          color: black
        - type: text
          value: "Precipitation"
          x: 490
          y: 238
          size: 18
          color: black
          font: "{{ _font_small }}"
          anchor: mm
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[1].precipitation_probability | default(0) | int }}%"
          x: 490
          y: 265
          size: 25
          color: black
          font: "{{ _font_small }}"
          anchor: mm

        # ── RIGHT COL ROW 1: Sunset ──
        - type: icon
          value: mdi:weather-sunset-down
          x: 602
          y: 90
          size: 40
          color: black
        - type: text
          value: "Sunset"
          x: 702
          y: 98
          size: 18
          color: black
          font: "{{ _font_small }}"
          anchor: mm
        - type: text
          value: "{{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%-I:%M %p') }}"
          x: 702
          y: 125
          size: 25
          color: black
          font: "{{ _font_small }}"
          anchor: mm

        # ── RIGHT COL ROW 2: Wind ──
        - type: icon
          value: mdi:weather-windy
          x: 602
          y: 160
          size: 40
          color: black
        - type: text
          value: "Wind"
          x: 702
          y: 168
          size: 18
          color: black
          font: "{{ _font_small }}"
          anchor: mm
        - type: text
          value: "{{ state_attr('weather.forecast_home', 'wind_speed') | round(0) | int }} mph"
          x: 702
          y: 195
          size: 25
          color: black
          font: "{{ _font_small }}"
          anchor: mm

        # ── RIGHT COL ROW 3: Pressure ──
        - type: icon
          value: mdi:gauge
          x: 602
          y: 230
          size: 40
          color: black
        - type: text
          value: "Pressure"
          x: 702
          y: 238
          size: 18
          color: black
          font: "{{ _font_small }}"
          anchor: mm
        - type: text
          value: "{{ state_attr('weather.forecast_home', 'pressure') | round(0) | int }} hPa"
          x: 702
          y: 265
          size: 25
          color: black
          font: "{{ _font_small }}"
          anchor: mm

        # =====================
        # FORECAST STRIP (y 306–479)
        # 5 rounded boxes × 150 px | centers: 80, 240, 400, 560, 720
        # =====================
        - type: rectangle
          x_start: 5
          y_start: 309
          x_end: 155
          y_end: 477
          radius: 20
          outline: black
          width: 2
        - type: rectangle
          x_start: 165
          y_start: 309
          x_end: 315
          y_end: 477
          radius: 20
          outline: black
          width: 2
        - type: rectangle
          x_start: 325
          y_start: 309
          x_end: 475
          y_end: 477
          radius: 20
          outline: black
          width: 2
        - type: rectangle
          x_start: 485
          y_start: 309
          x_end: 635
          y_end: 477
          radius: 20
          outline: black
          width: 2
        - type: rectangle
          x_start: 645
          y_start: 309
          x_end: 795
          y_end: 477
          radius: 20
          outline: black
          width: 2

        # ─── FORECAST DAY 1 (center x 80) ───
        - type: text
          value: "{{ as_timestamp(forecast['weather.forecast_home'].forecast[1].datetime) | timestamp_custom('%a') | upper }}"
          x: 80
          y: 325
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: mt
        - type: icon
          value: "{{ _cicons['fc1'] }}"
          x: 48
          y: 350
          size: 65
          color: black
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[1].temperature | round(0) | int }} /"
          x: 87
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: rm
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[1].templow | round(0) | int }}"
          x: 92
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: lm

        # ─── FORECAST DAY 2 (center x 240) ───
        - type: text
          value: "{{ as_timestamp(forecast['weather.forecast_home'].forecast[2].datetime) | timestamp_custom('%a') | upper }}"
          x: 240
          y: 325
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: mt
        - type: icon
          value: "{{ _cicons['fc2'] }}"
          x: 208
          y: 350
          size: 65
          color: black
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[2].temperature | round(0) | int }} /"
          x: 247
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: rm
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[2].templow | round(0) | int }}"
          x: 252
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: lm

        # ─── FORECAST DAY 3 (center x 400) ───
        - type: text
          value: "{{ as_timestamp(forecast['weather.forecast_home'].forecast[3].datetime) | timestamp_custom('%a') | upper }}"
          x: 400
          y: 325
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: mt
        - type: icon
          value: "{{ _cicons['fc3'] }}"
          x: 368
          y: 350
          size: 65
          color: black
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[3].temperature | round(0) | int }} /"
          x: 407
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: rm
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[3].templow | round(0) | int }}"
          x: 412
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: lm

        # ─── FORECAST DAY 4 (center x 560) ───
        - type: text
          value: "{{ as_timestamp(forecast['weather.forecast_home'].forecast[4].datetime) | timestamp_custom('%a') | upper }}"
          x: 560
          y: 325
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: mt
        - type: icon
          value: "{{ _cicons['fc4'] }}"
          x: 528
          y: 350
          size: 65
          color: black
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[4].temperature | round(0) | int }} /"
          x: 567
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: rm
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[4].templow | round(0) | int }}"
          x: 572
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: lm

        # ─── FORECAST DAY 5 (center x 720) ───
        - type: text
          value: "{{ as_timestamp(forecast['weather.forecast_home'].forecast[5].datetime) | timestamp_custom('%a') | upper }}"
          x: 720
          y: 325
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: mt
        - type: icon
          value: "{{ _cicons['fc5'] }}"
          x: 688
          y: 350
          size: 65
          color: black
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[5].temperature | round(0) | int }} /"
          x: 727
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: rm
        - type: text
          value: "{{ forecast['weather.forecast_home'].forecast[5].templow | round(0) | int }}"
          x: 732
          y: 437
          size: 22
          color: black
          font: "{{ _font_main }}"
          anchor: lm

    target:
      device_id: !input device_id

mode: restart
